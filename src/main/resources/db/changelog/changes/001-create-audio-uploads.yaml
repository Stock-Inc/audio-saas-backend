databaseChangeLog:
  - changeSet:
      id: 001-create-audio-uploads
      author: audio-saas
      changes:
        - createTable:
            tableName: audio_uploads
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: original_filename
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: content_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: error_message
                  type: VARCHAR(500)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - createIndex:
            tableName: audio_uploads
            indexName: idx_audio_uploads_created_at
            columns:
              - column:
                  name: created_at
