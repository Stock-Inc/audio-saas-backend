spring:
  application:
    name: backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    change-log: db/changelog/changelog-master.xml

  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1100MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/demo
          jwk-set-uri: http://keycloak:8080/realms/demo/protocol/openid-connect/certs

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      schema.registry.url: ${SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL:http://localhost:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when_authorized

  metrics:
    tags:
      application: audio-saas-backend

    distribution:
      percentiles-histogram:
        http.server.requests: true
audio:
  processor:
    url: ${AUDIO_PROCESSOR_URL}
    connect-timeout: 5s
    read-timeout: 120s

server:
  port: 8081

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match:
    - /api/v1/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: full
    filter: true
    try-it-out-enabled: true
    display-request-duration: true
    deep-linking: true
    default-models-expand-depth: 1
    persist-authorization: true

resilience4j:
  retry:
    instances:
      audioProcessor:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        enable-randomized-wait: true
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      audioProcessor:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
