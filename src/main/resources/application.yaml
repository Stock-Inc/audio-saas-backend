spring:
  application:
    name: backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    change-log: db/changelog/changelog-master.xml

  servlet:
    multipart:
      max-file-size: 1000MB
      max-request-size: 1100MB

audio:
  processor:
    url: ${AUDIO_PROCESSOR_URL}
    connect-timeout: 5s
    read-timeout: 120s

server:
  port: 8081

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
